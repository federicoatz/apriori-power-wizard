## .github/workflows/test.yml
## -----------------------------------------------------------------------
## Runs the testthat suite (R/ and modules/ calculation logic, project
## state, example library, ...) on every push and pull request, using the
## exact package versions pinned in renv.lock so CI failures reflect real
## regressions rather than an upstream package update. Then drives the
## running app through the full four-step wizard in a real headless
## Chrome (tests/e2e/flow_test.R) and asserts the rendered results match
## the solvers -- the layer no unit test can see. This does NOT build
## or deploy anything -- see .github/workflows/deploy-shinylive.yml for the
## GitHub Pages build, which runs independently on push to main.
## -----------------------------------------------------------------------

name: Run test suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RENV_CONFIG_SANDBOX_ENABLED: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Restore packages from renv.lock
        uses: r-lib/actions/setup-renv@v2

      - name: Run testthat suite
        run: |
          Rscript -e '
            source("global.R")
            results <- testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = FALSE)
            df <- as.data.frame(results)
            failed <- sum(df$failed, na.rm = TRUE) > 0 || sum(df$error, na.rm = TRUE) > 0
            cat(sprintf("\nTotal: %d passed, %d failed, %d errors, %d skipped\n",
                        sum(df$passed, na.rm = TRUE), sum(df$failed, na.rm = TRUE),
                        sum(df$error, na.rm = TRUE), sum(df$skipped, na.rm = TRUE)))
            if (failed) quit(status = 1)
          '

      - name: Set up Chrome for the browser flow test
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Browser flow test (wizard end-to-end vs. the solvers)
        env:
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: Rscript tests/e2e/flow_test.R 7801
